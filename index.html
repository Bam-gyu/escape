<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숙소탈출 — 감시를 피해 편의점까지</title>
<meta name="description" content="아이돌 둘이 숙소에서 몰래 나와 편의점에 간다. 커서를 따라 움직이고, 감시에 닿으면 들킨다. 마우스 피하기 게임.">
<meta name="theme-color" content="#0d1016">

<!-- 링크를 붙였을 때 뜨는 것. 없으면 카톡·디스코드에 맨 주소만 나와서
     무슨 게임인지 알 수가 없다. 그림은 절대 주소라야 한다 —
     상대 주소는 퍼가는 쪽에서 못 찾는다. -->
<meta property="og:type" content="website">
<meta property="og:title" content="숙소탈출 — 감시를 피해 편의점까지">
<meta property="og:description" content="아이돌 둘이 숙소에서 몰래 나와 편의점에 간다. 감시에 닿으면 들킨다.">
<meta property="og:url" content="https://bam-gyu.github.io/escape/">
<meta property="og:image" content="https://bam-gyu.github.io/escape/art/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<!-- 탭 아이콘. 파일로 두면 브라우저가 찾다가 404를 남기는데, 그게 콘솔에서
     진짜 문제처럼 보인다. 주소 안에 그려 넣어 요청 자체를 없앤다. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100dvh; background: #0d1016;
        display: flex; align-items: center; justify-content: center;
        font-family: "Nanum Pen Script", system-ui, sans-serif;
        overflow: hidden;

        /* 손가락으로 끌 때 화면이 같이 딸려가거나 새로고침되면 안 된다. */
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    /* 100dvh는 폰의 주소창이 접혔다 펴져도 화면이 안 흔들리게 한다.
       100vh는 주소창이 있을 때의 높이라, 스크롤될 때마다 게임이 위아래로 튄다. */
    #stage { position: relative; width: min(100vw, 133.333dvh); aspect-ratio: 4 / 3; }
    #screen {
        width: 100%; height: 100%; display: block; cursor: none; background: #2f3646;

        /* 캔버스 위의 손가락은 전부 게임 것이다. 이게 없으면 끄는 동안
           브라우저가 화면을 확대하거나 밀어버린다. */
        touch-action: none;
    }

    /* 타이틀과 연출. 캔버스 위에 덮는다. */
    .overlay {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; color: #f3eee6;
    }
    .overlay[hidden] { display: none; }
    #title { background: radial-gradient(ellipse at 50% 40%, #2a3350, #0d1016 78%); }

    /* 소리를 켜기 위한 문. <b>브라우저가 막고 있을 때만 나온다.</b>
       이 게임의 첫 클릭은 [게임 시작]인데, 그게 곧 타이틀을 떠나는 클릭이라
       타이틀 음악이 제 화면에서 날 틈이 없다. 떠나지 않는 첫 클릭이 필요하다. */
    #gate {
        background: radial-gradient(ellipse at 50% 40%, #2a3350, #0d1016 78%);
        cursor: pointer;

        /* 타이틀보다 위에 있어야 한다. 겹친 것은 나중에 나온 쪽이 위에 그려지는데,
           문은 타이틀보다 먼저 적혀 있어서 그냥 두면 뒤에 깔린다. */
        z-index: 10;
    }
    #gate h1 { opacity: 0.35; }
    #gate p { margin-top: 40px; font-size: 38px; color: #ff9ec4; }
    #gate small { display: block; margin-top: 10px; font-size: 22px; color: #6b7382; }

    h1 { margin: 0; font-size: 84px; font-weight: 400; letter-spacing: 2px; }
    h2 { margin: 6px 0 0; font-size: 30px; font-weight: 400; color: #9fb0c8; }

    button {
        font-family: inherit; font-size: 34px; color: #ff9ec4;
        background: transparent; border: 3px solid #ff9ec4; border-radius: 4px;
        padding: 4px 30px; cursor: pointer; transform: rotate(-2deg);
    }
    button:hover { background: #ff9ec4; color: #16121a; }

    #title button { margin-top: 34px; }

    /* 연출의 버튼만은 아무 데나 두면 안 된다. 1번 방의 시작 자리 위에
       정확히 올려야, 누르는 순간 커서가 이미 그 자리에 있게 된다. */
    /* 연출 그림(불 끈 방)이 비쳐 보여야 한다. 덮지 않고 살짝만 눌러준다. */
    #intro { background: rgba(13, 16, 22, 0.42); justify-content: flex-start; }
    #intro-lines {
        margin-top: 14%; font-size: 40px; line-height: 1.6; color: #f3eee6;
        text-shadow: 0 2px 0 #0d1016, 0 0 12px #0d1016;
    }
    #go {
        position: absolute; transform: translate(-50%, -50%) rotate(-2deg);
        white-space: nowrap;
    }

    /* 세로로 들면 화면이 손톱만 해진다. 돌려달라고만 한다 —
       억지로 돌리는 것은 브라우저가 막아둔 지 오래다. */
    #turn { display: none; }
    @media (orientation: portrait) and (pointer: coarse) {
        #turn {
            display: flex; position: fixed; inset: 0; z-index: 30;
            align-items: center; justify-content: center; text-align: center;
            background: #0d1016; color: #9fb0c8; font-size: 34px; line-height: 1.7;
        }
    }

    #keys {
        position: absolute; left: 0; right: 0; bottom: -28px;
        text-align: center; font-size: 18px; color: #6b7382;
    }

    /* 원작 표기. 이건 습작이고, 규칙과 장치를 가져온 곳이 있다.
       문서에만 적어두면 게임을 하는 사람은 영영 모른다. */
    #credit {
        margin-top: 30px; font-size: 20px; line-height: 1.6; color: #6b7382;
    }
    #credit a { color: #9fb0c8; }
</style>
</head>
<body>
<div id="stage">
    <canvas id="screen"></canvas>

    <div class="overlay" id="gate" hidden>
        <h1>숙소탈출</h1>
        <p>화면을 눌러 시작</p>
        <small>브라우저가 소리를 막고 있습니다</small>
    </div>

    <div class="overlay" id="title">
        <h1>숙소탈출</h1>
        <h2>감시를 피해 편의점까지</h2>
        <button type="button" id="start">게임 시작</button>

        <div id="credit">
            마우스 피하기 규칙은 YunoGT의 「감옥탈출 리마스터」에서 가져온 습작입니다.<br>
            설정 · 그림 · 소리 · 방 배치는 직접 만들었습니다.<br>
            <a href="https://vidkidz.tistory.com/155" target="_blank" rel="noopener">원작 보러 가기</a>
        </div>
    </div>

    <div class="overlay" id="intro" hidden>
        <div id="intro-lines">
            새벽 두 시.<br>
            매니저도, 멤버들도 잔다.<br>
            지금이 아니면 못 나간다.
        </div>
        <button type="button" id="go">문을 연다</button>
    </div>

    <div id="turn">
    가로로 돌려주세요<br>
    <span style="font-size:24px;color:#6b7382">화면을 끌면 주인공이 그만큼 움직입니다</span>
</div>

    <div id="keys">H 방 편집기 · M 소리 끄기 · Esc 마우스 놓기</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
